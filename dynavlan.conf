# /etc/dynavlan.conf - configuration for dynavlan.
#
# Every key is shown commented at its built-in default. Uncomment and edit to
# override. Invalid values cause dynavlan to refuse to run (logged at err); it
# never silently falls back to a default for a value you set wrong.
#
# This file is parsed as plain KEY=value, NOT sourced as a shell script: only the
# documented keys below are accepted. A line setting any other name (or a typo, or
# non-assignment content) makes dynavlan refuse to run rather than silently ignore
# it. Quote values with spaces (RESTART_SNAPS/RESTART_SERVICES); inline # comments
# after a value are fine.
#
# After changing RESCAN_MINUTES, re-run `dynavlan --reconfigure` (writes the
# systemd timer drop-in and reloads). Other keys take effect on the next run, EXCEPT that a
# change to what dynavlan GENERATES (for example VLAN_ROUTES) does not touch VLANs it already
# owns until you run an attended `dynavlan --reapply`; VLAN_ROUTE_METRIC_START only affects
# future metric assignments (including already-owned VLANs that lack a persisted metric during an
# isolated-to-routed --reapply); it never renumbers an existing persisted assignment.
#
# Number grammar: whole decimal numbers only, written without a leading zero (5, not 05; 0 where
# 0 is allowed). A malformed number, an empty element in VLAN_IGNORE ("1,,3", "1,"), an
# unmatched quote, or text after a closing quote makes dynavlan refuse to run.

# DETECT_METHOD="both"                          # both | lldp | sniff
# VLAN_MIN=1                                     # >= 1  (VLAN 1 is a real VLAN on many trunks; use VLAN_IGNORE to skip specific IDs)
# VLAN_MAX=1000                                  # <= 4094
# VLAN_IGNORE=""                                 # IDs never ADDED (suppresses new candidates only; VLANs already owned are kept, see `dynavlan --status` owned-ignored); comma/space list w/ ranges, e.g. "1,5,20-25,80"
# VLAN_WARN=32                                   # warn (proceed) above this many VLANs
# VLAN_LIMIT=64                                  # hard cap on total VLANs; 0 = unlimited (0 is not validated at scale: the apply confirmation window is a fixed 30s and does not grow with the VLAN count, so you accept that timing risk)
# VLAN_LIMIT_MODE=refuse                         # refuse = over limit applies nothing (loud); fill = add lowest ids up to the limit, log the skipped rest
# SNIFF_SECONDS=60                               # passive capture window; must be >= 1
# BOOT_SETTLE_SECONDS=20                         # settle between two samples: boot-removal detection passes, AND the carrier-down debounce. Actual debounce = this on rescan and on RESET_ON_BOOT=false boots; on RESET_ON_BOOT=true boots the pass-2 re-detect falls between the samples, making it this + CARRIER_WAIT_SECONDS + SNIFF_SECONDS (~110s at defaults). Values below 5 are clamped to 5 for the carrier samples while REMOVE_ON_CARRIER_LOSS=true
# CARRIER_WAIT_SECONDS=30                        # max wait for link carrier before sniff
# LEASE_SETTLE_SECONDS=30                        # max wait for new VLAN leases before restarts (ONE box-wide deadline, not per-VLAN: all new VLANs are polled together, so total wait is bounded by this regardless of count)
# RESCAN_MINUTES=5                               # timer interval (re-run --reconfigure after changing)
# RESET_ON_BOOT=true                             # true = reconcile at boot; false = skip the boot detection-diff removals (carrier-down pruning is governed by REMOVE_ON_CARRIER_LOSS)
# REMOVE_ON_CARRIER_LOSS=true                    # true = prune an owned trunk's VLANs after a debounced carrier-down loss (boot + rescan), gated on healthy routing; false = always preserve (independent of RESET_ON_BOOT)
# REMOVE_MISSING_MINUTES=15                      # remove an owned VLAN that every trusted sample on its carrier-up trunk has missed for this long (rescan removes, boot only starts the clock; the clock restarts at reboot), gated on healthy routing; 0 = off; else RESCAN_MINUTES*2..1440. Unset or empty = the larger of 15 and RESCAN_MINUTES*2
# VLAN_ROUTES=false                              # true = accept DHCP routes on discovered VLANs, each at its own metric (DNS/NTP stay declined). Default false = fully route-isolated
# VLAN_ROUTE_METRIC_START=100                    # first VLAN metric; must stay ABOVE the uplink default's metric or dynavlan refuses to apply
# RESTART_SNAPS=""                               # space-separated; snap restart after a VLAN change, e.g. "domotzpro-agent-publicstore" for the Domotz agent
# RESTART_SERVICES=""                            # space-separated; systemctl restart after a VLAN change
# LOG_LEVEL=info                                 # debug | info | notice | warning | err
# BACKUP_KEEP=10                                 # retained 90-dynavlan.yaml backups
# RESTART_ON_NEW_SUBNET=true                     # restart RESTART_SNAPS/SERVICES when a new IPv4 subnet appears on any interface (base/native/access or a dynavlan VLAN), not only on a tagged-VLAN change; no-op if no restart targets are set (FR-40)
