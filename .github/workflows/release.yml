name: Build and attach .deb to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: bash build-deb.sh "$PKG_VERSION"

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$TAG_NAME" "dynavlan_${PKG_VERSION}_all.deb"
