name: Build and attach .deb to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: bash build-deb.sh "$PKG_VERSION"

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$TAG_NAME" "dynavlan_${PKG_VERSION}_all.deb"

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-22.04
    concurrency:
      group: publish-apt
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Fetch every release .deb
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p debs
          # Enumerate ALL releases. gh's default --limit is 30, so without this a
          # rebuild after 30 releases would silently drop the oldest .debs from the
          # published repo (M2). 1000 dwarfs any realistic count for this project;
          # guard below fails loudly if we ever actually hit the cap.
          tags=$(gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName -q '.[].tagName')
          [ "$(printf '%s\n' "$tags" | grep -c .)" -ge 1000 ] \
            && { echo "::error::hit the 1000-release list cap; raise --limit or paginate"; exit 1; }
          expected=0
          for tag in $tags; do
            # A release that carries a .deb MUST download; one with none (e.g. a
            # docs-only tag) is legitimately skipped. This distinguishes "no asset"
            # from "fetch error", which the old warning-and-continue conflated (M2).
            n=$(gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets -q '[.assets[] | select(.name | endswith(".deb"))] | length')
            [ "$n" -eq 0 ] && continue
            expected=$((expected + n))
            gh release download "$tag" --repo "${{ github.repository }}" \
              --pattern '*.deb' --dir debs --clobber \
              || { echo "::error::failed to fetch a .deb for release $tag"; exit 1; }
          done
          got=$(find debs -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          echo "expected $expected .deb asset(s) across all releases; downloaded $got"
          [ "$got" -eq "$expected" ] \
            || { echo "::error::downloaded $got .debs but $expected were expected"; exit 1; }
          # The release being published now must be in the rebuilt repo, else this
          # publish would ship a repo missing the very version it announces (M2).
          test -f "debs/dynavlan_${PKG_VERSION}_all.deb" \
            || { echo "::error::just-published dynavlan_${PKG_VERSION}_all.deb missing from rebuild"; exit 1; }
          ls -la debs

      - name: Build the signed repo (ephemeral reprepro db)
        run: |
          mkdir -p apt/pool apt/dists apt/db
          for deb in $(ls -v debs/*.deb); do
            reprepro -b apt -C main includedeb stable "$deb"
          done

      - name: Add public keyring to the published tree
        run: cp dynavlan-archive-keyring.gpg apt/dynavlan-archive-keyring.gpg

      - name: Prune the reprepro working db (not part of the published tree)
        run: rm -rf apt/db apt/conf apt/logs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
